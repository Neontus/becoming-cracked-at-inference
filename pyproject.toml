[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "A from-first-principles learning lab for LLM inference systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Juno Kim" }]
dependencies = [
    "torch>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
