name: Validate public notes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate publishable Markdown
        run: python3 scripts/check_public_notes.py

